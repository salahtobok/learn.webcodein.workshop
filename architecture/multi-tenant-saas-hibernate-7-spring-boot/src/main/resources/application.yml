spring:
  application:
    name: multi-tenant-saas
  datasource:
    url: jdbc:postgresql://localhost:5432/saas_db
    username: myuser
    password: secretpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        tenant_identifier_resolver: com.webcodein.saas.config.TenantIdentifierResolver
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
