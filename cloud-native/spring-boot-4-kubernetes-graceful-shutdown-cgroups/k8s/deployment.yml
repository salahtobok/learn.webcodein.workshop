apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-k8s-readiness
  labels:
    app: spring-boot-k8s-readiness
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spring-boot-k8s-readiness
  template:
    metadata:
      labels:
        app: spring-boot-k8s-readiness
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: app
          image: ghcr.io/salahtobok/spring-boot-4-kubernetes-graceful-shutdown-cgroups:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "1000m"
              memory: "1024Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: spring-boot-k8s-service
spec:
  type: ClusterIP
  selector:
    app: spring-boot-k8s-readiness
  ports:
    - port: 80
      targetPort: 8080
