spring.application.name=opentelemetry-grafana-demo

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Enable Observation (Tracing/Metrics) for all components
management.tracing.sampling.probability=1.0

# OTLP Export to OpenTelemetry Collector
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.otlp.metrics.endpoint=http://localhost:4318/v1/metrics

# Logging format (to include traceId and spanId)
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
