name: Build workshop projects

# GitHub only runs workflows from the repository root, so this one builds every
# companion project in the domain folders. Add a matrix entry when a project is added.

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "**/*.md" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "**/*.md" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - architecture/hexagonal-architecture-spring-boot-4
          - architecture/spring-modulith-modular-monoliths-spring-boot-4
          - cloud-native/graalvm-native-image-spring-boot
          - cloud-native/cicd-github-actions-terraform-swarm
          - persistence/hibernate-7-spring-data-jpa-4          # Testcontainers (Docker)
          - persistence/jakarta-data-1-0-vs-spring-data
          - security/jakarta-security-4-vs-spring-security-7/spring-security
          - security/jakarta-security-4-vs-spring-security-7/jakarta-security
          - security/zero-trust-spring-security-7-ebpf-mesh
          - testing/testcontainers-docker-compose-spring-boot-4  # Testcontainers (Docker)
          - ai/spring-ai-2-0-spring-boot-4
          - ai/enterprise-rag-spring-ai-vector-database
          - java-core/project-valhalla-value-types-java-25
          - architecture/event-driven-kafka-spring-boot-4
          - observability/opentelemetry-grafana-spring-boot-4
          - java-core/virtual-threads-spring-boot-4
          - architecture/hexagonal-architecture-ddd-jakarta-ee-11
          - architecture/introduction-to-ddd-jakarta-ee-11
          - architecture/domain-driven-design-explained-beginners-guide
          - architecture/first-ddd-application-spring-boot-4-tutorial
          - architecture/ddd-vs-crud-visual-guide-java-developers
          - architecture/ddd-building-blocks-java-25-entity-value-object-aggregate
          - architecture/bounded-context-ddd-explained-beginners
          - architecture/ubiquitous-language-ddd-naming-things
          - architecture/ddd-for-crud-developers-when-why-level-up
          - architecture/refactoring-legacy-spring-boot-to-hexagonal-architecture
          - architecture/hexagonal-vs-clean-vs-onion-architecture
          - architecture/ddd-layers-explained-code-structure-spring-boot
          - architecture/ddd-concepts-java-developer-must-know
          - architecture/ddd-mistakes-beginners-how-to-avoid
          - architecture/strategy-pattern-java-jakarta-ee-guide
          - architecture/jobrunr-distributed-background-jobs-spring-boot-4
          - cloud-native/jenkins-pipeline-spring-boot-4-graalvm
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.project }}/pom.xml

      # Docker is preinstalled on ubuntu-latest, so Testcontainers works without extra setup.
      # This runs the JVM build and tests; the native image build is not part of CI.
      - name: Build and test
        run: mvn -B -ntp -f "${{ matrix.project }}/pom.xml" verify

