services:
  postgres:
    image: postgres:16-alpine
    container_name: nplusone-postgres
    environment:
      POSTGRES_DB: nplusonedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nplusonedb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
