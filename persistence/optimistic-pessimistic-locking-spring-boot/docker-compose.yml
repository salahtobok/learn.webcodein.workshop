services:
  postgres:
    image: postgres:16-alpine
    container_name: locking-postgres
    environment:
      POSTGRES_DB: locking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - locking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d locking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  locking_pgdata:
