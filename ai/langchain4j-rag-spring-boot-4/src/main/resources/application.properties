spring.application.name=langchain4j-rag-spring-boot-4

# LangChain4j OpenAI Configuration with fallback
langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY:demo-key}
langchain4j.open-ai.chat-model.model-name=gpt-4o-mini
langchain4j.open-ai.chat-model.temperature=0.2

langchain4j.open-ai.embedding-model.api-key=${OPENAI_API_KEY:demo-key}
langchain4j.open-ai.embedding-model.model-name=text-embedding-3-small

# PgVector Configuration
langchain4j.pgvector.host=${PGVECTOR_HOST:localhost}
langchain4j.pgvector.port=${PGVECTOR_PORT:5432}
langchain4j.pgvector.database=${PGVECTOR_DATABASE:vector_db}
langchain4j.pgvector.user=${PGVECTOR_USER:postgres}
langchain4j.pgvector.password=${PGVECTOR_PASSWORD:postgres}
langchain4j.pgvector.table=langchain4j_embeddings
langchain4j.pgvector.dimension=1536
